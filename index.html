<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Крестики-Нолики PRO</title>
 <!-- Исправленная строка подключения Telegram WebApp ниже: -->
 <script src="https://telegram.org"></script>
 <style>
 body { font-family: sans-serif; text-align: center; background: #1c1c1e; color: #ffffff; margin: 0; padding: 15px; user-select: none; }
 .board { display: grid; grid-template-columns: repeat(3, 90px); grid-gap: 10px; justify-content: center; margin: 15px auto; }
 .cell { width: 90px; height: 90px; background: #2c2c2e; font-size: 2.3rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 14px; font-weight: bold; transition: all 0.2s ease; }
 .cell:active { transform: scale(0.92); background: #3a3a3c; }
 #status { font-size: 1.1rem; margin-bottom: 5px; color: #eaeaea; font-weight: bold; }
 .timer-text { font-size: 1.2rem; color: #ff3b30; font-weight: bold; margin: 8px 0; transition: color 0.3s; }
 .timer-text.warning { color: #ff9500; animation: blink 0.8s infinite; }
 @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
 .profile-container { background: #2c2c2e; padding: 10px; border-radius: 16px; display: inline-block; width: 90%; max-width: 340px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
 .stat-row { display: flex; justify-content: space-around; font-size: 0.9rem; color: #aaaaaa; margin-bottom: 5px; }
 .stat-val { color: #ffffff; font-weight: bold; font-size: 1.1rem; }
 .winrate-bar-bg { background: #48484a; height: 6px; border-radius: 3px; width: 90%; margin: 5px auto 0 auto; overflow: hidden; }
 .winrate-bar-fill { background: #34c759; height: 100%; width: 0%; transition: width 0.5s ease; }
 .shop-title { font-size: 1.2rem; font-weight: bold; margin: 20px 0 10px 0; color: #ffd60a; display: flex; align-items: center; justify-content: center; gap: 5px; }
 .shop-container { display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 340px; margin: 0 auto 20px auto; max-height: 180px; overflow-y: auto; padding-right: 5px; }
 .shop-item { background: #2c2c2e; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #3a3a3c; transition: border 0.2s; }
 .shop-item.equipped { border-color: #007aff; background: #1c2e4a; }
 .skin-info { text-align: left; }
 .skin-name { font-weight: bold; font-size: 0.95rem; }
 .skin-icons { font-size: 1.2rem; margin-top: 2px; }
 .shop-btn { padding: 6px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: #fff; background: #007aff; }
 .shop-btn.equip-btn { background: #30b0c7; }
 .shop-btn.owned-btn { background: #48484a; color: #aeaeae; cursor: default; }
 .btn { background: #007aff; color: #fff; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 10px; cursor: pointer; display: none; margin: 15px auto; transition: background 0.2s; }
 .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; }
 .modal-content { background: #2c2c2e; padding: 25px; border-radius: 16px; width: 85%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
 .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
 .btn-accept { background: #34c759; color: #fff; }
 .btn-decline { background: #ff3b30; color: #fff; }
 .cell.win-line { background: #34c759 !important; color: #ffffff !important; transform: scale(1.03); box-shadow: 0 0 12px rgba(52, 199, 89, 0.5); }
 .custom-alert { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 200; }
 .alert-box { background: #2c2c2e; border: 1px solid #3a3a3c; padding: 20px; border-radius: 16px; width: 85%; max-width: 300px; box-shadow: 0 4px 25px rgba(0,0,0,0.6); }
 .alert-msg { font-size: 1rem; color: #eaeaea; margin-bottom: 15px; font-weight: bold; }
 .alert-input { display: none; width: 90%; padding: 10px; background: #1c1c1e; border: 1px solid #48484a; border-radius: 8px; color: #fff; text-align: center; font-size: 1.1rem; margin: 5px auto 15px auto; }
 .alert-input:focus { border-color: #007aff; outline: none; }
 .alert-btn { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 80px; }
 </style>
</head>
<body>
 <div class="profile-container">
 <div class="stat-row">
 <div>🏆 Побед: <span id="p-wins" class="stat-val">0</span></div>
 <div>❌ Проиграл: <span id="p-losses" class="stat-val">0</span></div>
 <div>🤝 Ничьи: <span id="p-draws" class="stat-val">0</span></div>
 <div>📊 Winrate: <span id="p-rate" class="stat-val">0%</span></div>
 </div>
 <div class="winrate-bar-bg"><div id="rate-fill" class="winrate-bar-fill"></div></div>
 </div>
 <h2 id="game-title" style="margin-top: 10px; cursor: pointer;" onclick="handleAdminClick()">Крестики-Нолики ❌⭕</h2>
 <div id="status">Инициализация игровой сессии...</div>
 
 <!-- Красивое кастомное уведомление -->
 <div id="custom-toast" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(30, 30, 30, 0.95); color: #fff; border: 1px solid #ff3b30; padding: 14px 24px; border-radius: 12px; font-weight: bold; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px;">
 <span id="toast-icon">⚠️</span>
 <span id="toast-text">Ошибка при покупке</span>
 </div>

 <div id="timer-display" class="timer-text" style="display: none;">⏱️ Время на ход: 10 сек</div>
 <div class="board" id="board">
 <div class="cell" onclick="handleCellClick(0)"></div>
 <div class="cell" onclick="handleCellClick(1)"></div>
 <div class="cell" onclick="handleCellClick(2)"></div>
 <div class="cell" onclick="handleCellClick(3)"></div>
 <div class="cell" onclick="handleCellClick(4)"></div>
 <div class="cell" onclick="handleCellClick(5)"></div>
 <div class="cell" onclick="handleCellClick(6)"></div>
 <div class="cell" onclick="handleCellClick(7)"></div>
 <div class="cell" onclick="handleCellClick(8)"></div>
 </div>
 <button id="rematch-btn" class="btn" onclick="sendRematchRequest()">Сыграть еще раз</button>
 <div class="shop-title">🛍️ Магазин кастомных скинов</div>
 <div class="shop-container" id="shop-box"></div>
 <div id="rematch-modal" class="modal">
 <div class="modal-content">
 <div style="font-size: 1.1rem; font-weight: bold;">Противник хочет с Вами сыграть еще раз! 🤝</div>
 <div class="modal-buttons">
 <button class="btn btn-accept" style="display:block;" onclick="acceptRematch()">Принять</button>
 <button class="btn btn-decline" style="display:block;" onclick="declineRematch()">Отклонить</button>
 </div>
 </div>
 </div>
 <div id="custom-alert" class="custom-alert">
 <div class="alert-box">
 <div id="alert-text" class="alert-msg">Сообщение</div>
 <input type="text" id="alert-field" class="alert-input">
 <div style="display: flex; gap: 10px; justify-content: center;">
 <button id="alert-ok" class="alert-btn">ОК</button>
 <button id="alert-cancel" class="alert-btn" style="background: #48484a; display: none;">Отмена</button>
 </div>
 </div>
 </div>
 <script>
 const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
 if (tg) tg.expand();
 const urlParams = new URLSearchParams(window.location.search);
 let roomId = urlParams.get('room');
 let userId = urlParams.get('user');
 if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
 if (!userId || userId === "null" || userId.startsWith("player_")) {
 userId = String(tg.initDataUnsafe.user.id);
 }
 if (!roomId || roomId === "null" || roomId.startsWith("lobby_")) {
 roomId = String(tg.initDataUnsafe.user.id);
 }
 }
 if (!roomId || roomId === "null") roomId = "lobby_" + Math.floor(Math.random() * 10000);
 if (!userId || userId === "null") userId = "player_" + Math.floor(Math.random() * 10000);
 let mySymbol = "";
 let boardState = ["", "", "", "", "", "", "", "", ""];
 let isMyTurn = false;
 let isGameActive = false;
 let lastStatus = "";
 const clientSkins = {
 "classic": {name: "Классика", cost: 0, x: "❌", o: "⭕"},
 "ninja": {name: "Дуэль Ниндзя", cost: 3, x: "⚔️", o: "🛡️"},
 "elements": {name: "Магия стихий", cost: 5, x: "🔥", o: "💧"},
 "halloween": {name: "Хэллоуин", cost: 10, x: "🎃", o: "💀"},
 "space": {name: "Космос", cost: 15, x: "🚀", o: "🛸"}
 };
 function highlightWin(line) {
 const cells = document.querySelectorAll('.cell');
 if (line && line.length > 0) {
 line.forEach(i => cells[i].classList.add('win-line'));
 }
 }
 function showNotification(text, hasInput = false, defaultValue = "") {
 return new Promise((resolve) => {
 document.getElementById('alert-text').innerText = text;
 const field = document.getElementById('alert-field');
 const cancelBtn = document.getElementById('alert-cancel');
 if (hasInput) {
 field.style.display = "block";
 field.value = defaultValue;
 cancelBtn.style.display = "block";
 } else {
 field.style.display = "none";
 cancelBtn.style.display = "none";
 }
 document.getElementById('custom-alert').style.display = "flex";
 document.getElementById('alert-ok').onclick = () => {
 document.getElementById('custom-alert').style.display = "none";
 resolve(hasInput ? field.value : true);
 };
 cancelBtn.onclick = () => {
 document.getElementById('custom-alert').style.display = "none";
 resolve(null);
 };
 });
 }
 function playSound(type) {
 try {
 const ctx = new (window.AudioContext || window.webkitAudioContext)();
 const osc = ctx.createOscillator();
 const gain = ctx.createGain();
 osc.connect(gain);
 gain.connect(ctx.destination);
 if (type === 'click') {
 osc.frequency.setValueAtTime(580, ctx.currentTime);
 gain.gain.setValueAtTime(0.1, ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
 osc.start(); osc.stop(ctx.currentTime + 0.08);
 } else if (type === 'win') {
 osc.frequency.setValueAtTime(440, ctx.currentTime);
 osc.frequency.setValueAtTime(554, ctx.currentTime + 0.1);
 osc.frequency.setValueAtTime(659, ctx.currentTime + 0.2);
 osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
 gain.gain.setValueAtTime(0.15, ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
 osc.start(); osc.stop(ctx.currentTime + 0.5);
 } else if (type === 'lose') {
 osc.frequency.setValueAtTime(300, ctx.currentTime);
 osc.frequency.linearRampToValueAtTime(120, ctx.currentTime + 0.4);
 gain.gain.setValueAtTime(0.15, ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
 osc.start(); osc.stop(ctx.currentTime + 0.4);
 } else if (type === 'error') {
 osc.type = 'sawtooth';
 osc.frequency.setValueAtTime(150, ctx.currentTime);
 gain.gain.setValueAtTime(0.1, ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
 osc.start(); osc.stop(ctx.currentTime + 0.15);
 }
 } catch(e){}
 }
 function triggerVibration(style) {
 if (tg && tg.HapticFeedback) {
 if (style === 'light') tg.HapticFeedback.impactOccurred('light');
 else if (style === 'success') tg.HapticFeedback.notificationOccurred('success');
 else if (style === 'error') tg.HapticFeedback.notificationOccurred('warning');
 }
 }
 function renderShop(currentSkin, unlockedSkins, currentWins) {
 const shopBox = document.getElementById('shop-box');
 shopBox.innerHTML = "";
 const unlockedList = unlockedSkins.split(",");
 for (let skinId in clientSkins) {
 const skin = clientSkins[skinId];
 const isUnlocked = unlockedList.includes(skinId);
 const isEquipped = currentSkin === skinId;
 const item = document.createElement('div');
 item.className = `shop-item ${isEquipped ? 'equipped' : ''}`;
 let btnHtml = "";
 if (isEquipped) {
 btnHtml = `<button class="shop-btn owned-btn">Активен</button>`;
 } else if (isUnlocked) {
 btnHtml = `<button class="shop-btn equip-btn" onclick="shopAction('equip', '${skinId}')">Надеть</button>`;
 } else {
 btnHtml = `<button class="shop-btn" onclick="shopAction('buy', '${skinId}')">🛍️ Купить (${skin.cost})</button>`;
 }
 item.innerHTML = `
 <div class="skin-info">
 <div class="skin-name">${skin.name}</div>
 <div class="skin-icons">${skin.x} против ${skin.o}</div>
 </div>
 ${btnHtml}
 `;
 shopBox.appendChild(item);
 }
 }
async function shopAction(action, skinId) {
 try {
 const res = await fetch(`/shop/${userId}`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ action: action, skin_id: skinId, skinId: skinId })
 });
 
 const data = await res.json();
 if (data.success) {
 if (typeof playSound === 'function') playSound('win'); 
 if (typeof triggerVibration === 'function') triggerVibration('success'); 
 showToast("Скин успешно применён!", true);
 defUpdate();
 } else {
 if (typeof playSound === 'function') playSound('error'); 
 if (typeof triggerVibration === 'function') triggerVibration('error'); 
 showToast(data.message || "Ошибка при покупке", false);
 }
 } catch(e) {
 console.error("Ошибка при покупке скина:", e);
 }
}
 let titleClickCount = 0;
 let titleClickTimer = null;
 async function handleAdminClick() {
 titleClickCount++;
 if (titleClickCount === 1) {
 titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1500);
 }
 if (titleClickCount === 3) {
 clearTimeout(titleClickTimer); titleClickCount = 0;
 playSound('click'); triggerVibration('light');
 const pin = await showNotification("Введите ПИН-код администратора:", true);
 if (pin === "1488") {
 const targetId = await showNotification("🔧 Админка: Введите Telegram ID игрока:", true, userId);
 if (!targetId) return;
 const winsAmount = await showNotification("Сколько побед начислить?", true, "10");
 if (!winsAmount || isNaN(winsAmount)) return;
 try {
 const response = await fetch('/api/admin/give', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ secret_password: "SUPER_SECRET_WINS_KEY_99", target_id: targetId, amount: winsAmount })
 });
 const resData = await response.json();
 if (resData.success) {
 playSound('win'); triggerVibration('success'); await showNotification(resData.message);
 } else {
 playSound('error'); triggerVibration('error'); await showNotification("Ошибка: " + resData.message);
 }
 defUpdate();
 } catch (e) { await showNotification("Ошибка подключения к server."); }
 } else if (pin !== null) {
 playSound('error'); triggerVibration('error'); await showNotification("Неверный ПИН-код!");
 }
 }
 }
 async function defUpdate() {
 try {
 const response = await fetch(`/api/state/${roomId}/${userId}`);
 const data = await response.json();
 mySymbol = data.symbol;
 boardState = data.board;
 const wins = data.user_wins || 0;
 const losses = data.user_losses || 0;
 const draws = data.user_draws || 0;
 const total = wins + losses + draws;
 const rate = total > 0 ? Math.round((wins / total) * 100) : 0;
 document.getElementById('p-wins').innerText = wins;
 document.getElementById('p-losses').innerText = losses;
 document.getElementById('p-draws').innerText = draws;
 document.getElementById('p-rate').innerText = rate + "%";
 document.getElementById('rate-fill').style.width = rate + "%";
 renderShop(data.current_skin, data.unlocked_skins, wins);
 const cells = document.querySelectorAll('.cell');
 boardState.forEach((val, idx) => {
 cells[idx].innerText = val;
 if (data.status !== "over" && cells[idx].classList.contains('win-line')) {
 cells[idx].classList.remove('win-line');
 }
 });
 const rematchBtn = document.getElementById('rematch-btn');
 const rematchModal = document.getElementById('rematch-modal');
 const timerDisplay = document.getElementById('timer-display');
 if (data.status === "wait") {
 timerDisplay.style.display = "none";
 } else if (data.status === "active") {
 timerDisplay.style.display = "block";
 let secondsLeft = data.time_left !== undefined ? data.time_left : 10;
 timerDisplay.innerText = `⏱️ Время на ход: ${secondsLeft} сек`;
 if (secondsLeft <= 3) timerDisplay.classList.add('warning');
 else timerDisplay.classList.remove('warning');
 }
 if (data.status === "left") {
 isGameActive = false;
 document.getElementById('status').innerText = "Противник покинул игру. 🏃‍♂️";
 document.getElementById('board').style.opacity = "0.4";
 document.getElementById('board').style.pointerEvents = "none";
 rematchBtn.style.display = "none";
 rematchModal.style.display = "none";
 timerDisplay.style.display = "none";
 return;
 }
 if (data.status === "wait") {
 document.getElementById('status').innerText = `Вы играете за: ${data.visual_symbol}. Ожидаем соперника...`;
 isGameActive = false;
 rematchBtn.style.display = "none";
 rematchModal.style.display = "none";
 } else if (data.status === "active") {
 document.getElementById('board').style.opacity = "1";
 document.getElementById('board').style.pointerEvents = "auto";
 isGameActive = true;
 isMyTurn = (data.turn === mySymbol);
 document.getElementById('status').innerText = isMyTurn ? "Ваш ход!" : "Ход противника...";
 rematchBtn.style.display = "none";
 rematchModal.style.display = "none";
 } else if (data.status === "over") {
 isGameActive = false;
 if (data.winner === "Ничья") {
 document.getElementById('status').innerText = "Ничья! 🤝";
 } else {
 document.getElementById('status').innerText = (data.winner === mySymbol) ? "Вы победили! 🎉" : "Победил соперник! 🤖";
 highlightWin(data.win_line);
 }
 if (lastStatus !== "over") {
 if (data.winner === "Ничья") playSound('click');
 else if (data.winner === mySymbol) { playSound('win'); triggerVibration('success'); }
 else { playSound('lose'); triggerVibration('error'); }
 }
 const reqs = data.rematch_requests || [];
 if (data.rematch_declined) {
 rematchBtn.style.display = "block"; rematchBtn.disabled = true; rematchBtn.innerText = "Противник отклонил реванш ❌"; rematchModal.style.display = "none";
 } else if (reqs.length > 0) {
 if (reqs.includes(userId)) {
 rematchBtn.style.display = "block"; rematchBtn.disabled = true; rematchBtn.innerText = "Ожидание ответа..."; rematchModal.style.display = "none";
 } else {
 rematchBtn.style.display = "none"; rematchModal.style.display = "flex";
 }
 } else {
 rematchBtn.style.display = "block"; rematchBtn.disabled = false; rematchBtn.innerText = "Сыграть еще раз"; rematchModal.style.display = "none";
 }
 }
 lastStatus = data.status;
 } catch (err) { document.getElementById('status').innerText = "Ошибка синхронизации."; }
 }
 async function handleCellClick(index) {
 if (!isGameActive || !isMyTurn || boardState[index] !== "") {
 if (boardState[index] !== "") { playSound('error'); triggerVibration('error'); }
 return;
 }
 playSound('click'); triggerVibration('light');
 boardState[index] = "temp"; 
 isMyTurn = false;
 document.getElementById('status').innerText = "Отправка хода...";
 try {
 await fetch(`/api/move/${roomId}`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ index: index, symbol: mySymbol, user_id: userId })
 });
 defUpdate();
 } catch (e) { document.getElementById('status').innerText = "Ошибка отправки хода."; }
 }
 async function sendRematchRequest() {
 playSound('click');
 try { await fetch(`/api/rematch/${roomId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'request', user_id: userId }) }); defUpdate(); } catch (e) {}
 }
 async function acceptRematch() {
 playSound('win');
 try { await fetch(`/api/rematch/${roomId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'accept', user_id: userId }) }); defUpdate(); } catch (e) {}
 }
 async function declineRematch() {
 playSound('lose');
 try { await fetch(`/api/rematch/${roomId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'decline', user_id: userId }) }); defUpdate(); } catch (e) {}
 }
 setInterval(defUpdate, 1000);
 defUpdate();
 function showToast(text, isSuccess = false) {
 const toast = document.getElementById('custom-toast');
 const toastText = document.getElementById('toast-text');
 const toastIcon = document.getElementById('toast-icon');
 
 toastText.innerText = text;
 if (isSuccess) {
 toast.style.borderColor = '#34c759'; 
 toastIcon.innerText = '🎉';
 } else {
 toast.style.borderColor = '#ff3b30'; 
 toastIcon.innerText = '⚠️';
 }
 toast.style.transform = 'translateX(-50%) translateY(0)';
 setTimeout(() => {
 toast.style.transform = 'translateX(-50%) translateY(-100px)';
 }, 3000);
 }
 </script>
</body>
</html>
